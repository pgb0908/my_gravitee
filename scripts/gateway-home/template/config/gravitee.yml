# Minimal standalone Gateway: no database, no Management API.
# APIs are read from ${gravitee.home}/apis by the local sync (an internal, test-oriented mode).

http:
  port: 8082

plugins:
  path: ${gravitee.home}/plugins

repositories:
  management:
    type: none
  ratelimit:
    type: none

services:
  sync:
    repository:
      enabled: false
    local:
      enabled: true
      path: ${gravitee.home}/apis
  heartbeat:
    enabled: false
  core:
    http:
      enabled: true
      port: 18082
      host: localhost
      authentication:
        type: none
  metrics:
    enabled: false
  tracing:
    enabled: false

reporters:
  elasticsearch:
    enabled: false
  file:
    enabled: false

api:
  validateSubscription: false
